name: Roanwick CI

on:
  push:
  pull_request:

concurrency:
  group: roanwick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PGPASSWORD: roanwick_dev

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: roanwick, POSTGRES_PASSWORD: roanwick_dev, POSTGRES_DB: roanwick_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roanwick" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://roanwick:roanwick_dev@localhost:5432/roanwick_test
      TEST_DATABASE_URL: postgresql+psycopg://roanwick:roanwick_dev@localhost:5432/roanwick_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app
      - name: Migrations apply to an empty database and match the models
        run: |
          psql -h localhost -U roanwick -d roanwick_test -c "create extension if not exists btree_gist; create extension if not exists citext;"
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: roanwick, POSTGRES_PASSWORD: roanwick_dev, POSTGRES_DB: roanwick }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roanwick" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://roanwick:roanwick_dev@localhost:5432/roanwick
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      SEED_DEMO: "1"
      SEED_ADMIN_PASSWORD: DemoPass-2026!
      E2E_DEMO_PASSWORD: DemoPass-2026!
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Start the API
        working-directory: backend
        run: |
          pip install -e .
          psql -h localhost -U roanwick -d roanwick -c "create extension if not exists btree_gist; create extension if not exists citext;"
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && break; sleep 1; done
      - name: Build and start the web app
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npm run start > ../web.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 1 30); do curl -sf localhost:3000 >/dev/null && break; sleep 1; done
      - name: Browser tests (journeys, accessibility, mobile)
        working-directory: web
        run: npm run e2e
      - if: failure()
        run: tail -n 100 api.log web.log || true
