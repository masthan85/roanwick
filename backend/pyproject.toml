[project]
name = "roanwick-api"
version = "0.1.0"
description = "Roanwick home-services marketplace API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.40",
  "sqlalchemy>=2.1",
  "psycopg[binary]>=3.3",
  "alembic>=1.20",
  "pydantic-settings>=2.10",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.3",
  "email-validator>=2.3",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "slowapi>=0.1.9",
  "stripe>=16",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.15"]

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.models", "app.services"]

[tool.ruff]
line-length = 160
[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["F403", "F405", "B008", "B904", "B905"]
